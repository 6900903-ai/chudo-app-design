name: Deploy CHUDO demo to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CHUDO GitHub Pages demo
        run: npx vite build --config vite.pages.config.ts

      - name: Verify CHUDO page
        run: |
          test -f pages-dist/index.html
          echo "CHUDO index.html exists"
          find pages-dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload CHUDO Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy CHUDO
        id: deployment
        uses: actions/deploy-pages@v5
